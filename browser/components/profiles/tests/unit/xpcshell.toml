[DEFAULT]
run-if = [
  "os != 'android'",
]
head = "../../../../../toolkit/profile/test/xpcshell/head.js head.js"
firefox-appdir = "browser"

prefs = [
  "browser.profiles.enabled=true",
  "browser.profiles.created=false",
]

["test_TelemetryLockCount.js"]

["test_command_line_handler.js"]
run-sequentially = ["os == 'mac'"] # frequent fail in parallel on Mac

["test_copy_profile.js"]
skip-if = [
  "os == 'mac' && os_version == '10.15' && arch == 'x86_64'", # Bug 2002468
  "os == 'mac' && os_version == '15.30' && arch == 'aarch64'", # Bug 2016042
]

["test_create_profile.js"]

["test_datastore_uninit_during_init.js"]

["test_delete_last_profile.js"]

["test_fail_recover_storeID.js"]

["test_recover_database.js"]

["test_recover_empty_database.js"]

["test_recover_storeID.js"]

["test_relative_profile_path.js"]

["test_reset_profile_supported.js"]

["test_selectable_profile_launch.js"]

["test_selectable_profile_service_exists.js"]

["test_selectable_profiles_lifecycle.js"]
skip-if = [
  "os == 'mac' && os_version == '10.15' && arch == 'x86_64'", # Bug 1952514
  "os == 'mac' && os_version == '14.70' && arch == 'x86_64'", # Bug 1952514
]

["test_shared_prefs_lifecycles_methods.js"]

["test_usageProfileGroupID.js"]

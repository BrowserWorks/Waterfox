  "os == 'linux' && display == 'x11' && opt && !xorigin && !verify", # Bug 1969768 - Linux-opt passes only in the xorigin and verify mode
  "os == 'linux' && os_version == '22.04' && arch == 'x86_64' && display == 'wayland' && debug && !fission", # Linux-Wayland-debug may not pass in the non-fission mode
